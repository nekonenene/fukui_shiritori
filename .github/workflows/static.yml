# GitHub Pages へ静的コンテンツをデプロイするシンプルなワークフロー
name: Deploy static content to Pages

on:
  # デフォルトブランチへのプッシュで実行
  push:
    branches: ["main"]

  # Actions タブから手動で実行できるようにする
  workflow_dispatch:

# GitHub Pages へのデプロイに必要な GITHUB_TOKEN の権限設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイは1つだけに制限し、実行中と最新の待機キューの間に入った Run はスキップする。
# ただし、本番デプロイは最後まで完了させたいので、実行中の Run はキャンセルしない。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # dist ディレクトリの中身をアップロード
          path: '/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
